name: ci

on:
  push:
    branches: ["main", "develop", "phase0/base", "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python tests, evaluation and offline guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Evaluate rules against ground truth
        run: python -m src.validation.evaluate
      - name: Enforce offline-only product code
        run: python scripts/check_offline.py

  web:
    name: Web demo build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build
